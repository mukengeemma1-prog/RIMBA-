<style>
:root{--bg:#f2f6f3;--card:#fff;--tx:#14221a;--mu:#5d6b62;--g:#1f6b3a;--gt:#fff;--bd:#d9e3dc;--rd:#c0392b;--or:#c27c00;--sf:#e4efe7;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1812;--card:#1a2820;--tx:#e8f0ea;--mu:#9fb2a5;--g:#46b873;--gt:#06210f;--bd:#2b3e32;--rd:#ef7468;--or:#e8a93a;--sf:#223529}}
:root[data-theme="dark"]{--bg:#0f1812;--card:#1a2820;--tx:#e8f0ea;--mu:#9fb2a5;--g:#46b873;--gt:#06210f;--bd:#2b3e32;--rd:#ef7468;--or:#e8a93a;--sf:#223529}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:78px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:var(--gt);display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
.lg{height:46px;width:auto;background:#fff;border-radius:10px;padding:3px 6px;display:block}.br{display:flex;align-items:center;gap:10px}.br i{font-style:normal;font-weight:800;font-size:20px;width:36px;height:36px;border-radius:10px;background:var(--gt);color:var(--g);display:grid;place-items:center}.br b{font-size:18px;letter-spacing:.06em;display:block;line-height:1.1}.br small{font-size:11px;opacity:.85}.about{text-align:center;color:var(--mu);font-size:12px;padding:6px 0 4px}.about b{color:var(--tx)}header input{background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:5px 8px;font:inherit}
main{padding:12px;max-width:640px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.k small{color:var(--mu);display:block}.k strong{font-size:19px}
.k.big{grid-column:span 2;background:var(--g);color:var(--gt);border:0}.k.big small{color:inherit;opacity:.85}.k.big strong{font-size:28px}
h3{margin:18px 0 8px;font-size:15px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.it>div:first-child{min-width:0}.it small{color:var(--mu)}.r{text-align:right;white-space:nowrap}
.bd{display:inline-block;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--sf);color:var(--g)}
.bd.w{color:var(--or)}.bd.e{color:var(--rd)}
button{font:inherit;border:0;border-radius:10px;padding:9px 13px;background:var(--g);color:var(--gt);font-weight:600}
button.ghost{background:var(--sf);color:var(--tx)}button.s{padding:5px 9px;font-size:13px}button.x{background:none;color:var(--rd);padding:5px}
.add{width:100%;margin-bottom:10px;padding:12px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:0 0 auto;min-width:74px;background:none;color:var(--mu);border-radius:0;padding:8px 8px;font-size:11px;font-weight:500;white-space:nowrap}
nav button span{display:block;font-size:20px}nav button.on{color:var(--g);font-weight:700}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.b{flex:1;display:flex;align-items:flex-end;gap:2px;height:100%;position:relative}.b i{flex:1;background:var(--sf);border-radius:3px 3px 0 0;border:1px solid var(--g)}.b i.n{background:var(--g)}
.b span{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font-size:10px;color:var(--mu);transform:translateY(100%)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden],#gate[hidden]{display:none}#gate{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;padding:16px;overflow:auto}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.sheet h3{margin-top:0;font-size:17px}
label{display:block;margin-bottom:10px;color:var(--mu);font-size:13px}
input,select,textarea{display:block;width:100%;margin-top:3px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.row{display:flex;gap:8px}.row button{flex:1}
.empty{color:var(--mu);text-align:center;padding:22px 10px}
</style></head><body>
<header><div class="br"><img class="lg" id="lgh" alt="RIMBA"><div><b id="sub" style="font-size:15px;letter-spacing:0">RIMBA</b></div></div><div style="display:flex;gap:8px;align-items:center"><input type="month" id="mo"><button class="s" data-a="lock" aria-label="Verrouiller" style="background:var(--gt);color:var(--g)">&#128274;</button></div></header>
<main id="v"></main>
<nav id="nav"></nav>
<div id="modal" hidden></div><div id="gate" hidden></div>
<script>
const K='rimba_v2';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{p:[],c:[],s:[],e:[],y:[],a:[],f:[],n:0,u:null};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=n=>'$'+(+n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

let tab='dash',month=td().slice(0,7);
const sold=id=>sum(S.s.filter(x=>x.pid==id),x=>x.q);
const bought=id=>sum(S.a.filter(x=>x.pid==id),x=>x.q);
const stk=p=>p.stock+bought(p.id)-sold(p.id);
const tot=x=>x.q*x.sp,ben=x=>x.q*(x.sp-x.bp);
const invTot=f=>sum(S.s.filter(x=>x.fid==f.id),tot);
const debt=c=>sum(S.f.filter(f=>f.cid==c),f=>invTot(f)-f.paid)-sum(S.y.filter(y=>y.cid==c),y=>y.a);
const inM=(d,m)=>d.slice(0,7)==m;
function stats(m){const s=S.s.filter(x=>inM(x.d,m)),v=sum(s,tot),b=sum(s,ben),e=sum(S.e.filter(x=>inM(x.d,m)),x=>x.a);
 return{v,b,e,net:b-e,enc:sum(S.f.filter(f=>inM(f.d,m)),f=>f.paid)+sum(S.y.filter(y=>inM(y.d,m)),y=>y.a),q:sum(s,x=>x.q)}}
const stat=p=>{const q=stk(p);return q<=0?['Rupture','e']:q<=p.min?['À réapprovisionner','w']:['OK','']};
const empty=t=>`<div class="empty">${t}</div>`;
const del=(a,id)=>`<button class="x" data-a="${a}" data-id="${id}" aria-label="Supprimer">✕</button>`;

function home(){const m=stats(month),dt=sum(S.c,c=>Math.max(0,debt(c.id))),vs=sum(S.p,p=>Math.max(0,stk(p))*p.buy),al=S.p.filter(p=>stat(p)[1]);
 const PR=S.p.map(p=>{const x=S.s.filter(z=>z.pid==p.id&&inM(z.d,month));return{n:p.name,q:sum(x,z=>z.q),v:sum(x,tot),b:sum(x,ben)}}).filter(r=>r.q);
 let bars='',mx=1,L=[];
 for(let k=5;k>=0;k--){const[y,mm]=month.split('-');const d=new Date(+y,+mm-1-k,1),key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),st=stats(key);mx=Math.max(mx,st.v);L.push([d.toLocaleDateString('fr-FR',{month:'short'}),st])}
 L.forEach(([n,st])=>bars+=`<div class="b"><i style="height:${st.v/mx*100}%"></i><i class="n" style="height:${Math.max(0,st.net)/mx*100}%"></i><span>${n}</span></div>`);
 return`<div class="grid"><div class="k big"><small>Bénéfice net du mois</small><strong>${$(m.net)}</strong></div>
 <div class="k"><small>Ventes</small><strong>${$(m.v)}</strong></div><div class="k"><small>Bénéfice brut</small><strong>${$(m.b)}</strong></div>
 <div class="k"><small>Dépenses</small><strong>${$(m.e)}</strong></div><div class="k"><small>Argent encaissé</small><strong>${$(m.enc)}</strong></div>
 <div class="k"><small>Dettes clients</small><strong style="color:var(--rd)">${$(dt)}</strong></div><div class="k"><small>Valeur du stock</small><strong>${$(vs)}</strong></div></div>
 <h3>6 derniers mois : ventes (clair) et bénéfice net (foncé)</h3><div class="bars" style="margin-bottom:24px">${bars}</div>
 <h3>Résultats par produit (mois)</h3>${PR.length?PR.map(r=>`<div class="it"><div><b>${esc(r.n)}</b><br><small>${r.q} pièces vendues</small></div><div class="r"><b>${$(r.v)}</b><br><small>Gain ${$(r.b)}</small></div></div>`).join(''):empty('Aucune vente ce mois-ci.')}
 <h3>Stock à surveiller</h3>${al.length?al.map(p=>`<div class="it"><div>${esc(p.name)}</div><div class="r"><span class="bd ${stat(p)[1]}">${stat(p)[0]}</span> <small>${stk(p)} pièces</small></div></div>`).join(''):empty('Aucune alerte de stock.')}
 <button class="ghost add" data-a="acc">Mon compte (nom, téléphone, adresse)</button><button class="ghost add" data-a="bk">Sauvegarde et restauration</button><div class="about">${S.u?`<b>${esc(S.u.biz)}</b><br>${S.u.tel?esc(S.u.tel)+'<br>':''}${S.u.addr?esc(S.u.addr)+'<br>':''}<br>`:''}<b>RIMBA</b> · Fondateur : Emma MUKENGE</div>`}

let arch=0,fq='';
function invList(){let l=S.f.filter(f=>arch||inM(f.d,month));const q=fq.trim().toLowerCase();if(q)l=l.filter(f=>(f.no+' '+f.cn).toLowerCase().includes(q));
 l.sort((a,b)=>b.d.localeCompare(a.d)||b.n-a.n);if(!l.length)return empty(arch?'Aucune facture archivée.':'Aucune facture ce mois-ci. Chaque facture met à jour le stock, les clients et le tableau de bord.');
 return`<p style="color:var(--mu);margin:0 0 8px">${l.length} facture(s) · ${$(sum(l,invTot))}</p>`+l.map(f=>{const T=invTot(f),r=T-f.paid;
 return`<div class="it" data-a="vf" data-id="${f.id}" style="cursor:pointer"><div><b>${f.no}</b> · ${esc(f.cn||'Comptoir')}<br><small>${f.d.split('-').reverse().join('/')} · ${sum(S.s.filter(x=>x.fid==f.id),x=>x.q)} pièces</small></div><div class="r"><b>${$(T)}</b><br><span class="bd ${r<=0?'':f.paid>0?'w':'e'}">${r<=0?'Payée':'Reste '+$(r)}</span></div></div>`}).join('')}
function sales(){return`<button class="add" data-a="addS">+ Nouvelle facture</button><div class="row" style="margin-bottom:8px"><button class="s ${arch?'ghost':''}" data-a="am" data-id="0">Ce mois</button><button class="s ${arch?'':'ghost'}" data-a="am" data-id="1">Archives (toutes)</button></div>
 <input id="fq" placeholder="Chercher un client ou un numéro" value="${esc(fq)}" style="margin:0 0 10px"><div id="fl">${invList()}</div>`}

function produits(){return`<button class="add" data-a="addP">+ Nouveau produit</button>`+(S.p.length?S.p.map(p=>`<div class="it"><div style="flex:1"><b>${esc(p.name)}</b><br><small>Achat ${$(p.buy)} · Vente ${$(p.sell)} · Gain ${$(p.sell-p.buy)}/pièce<br>Stock initial ${p.stock} · Seuil d'alerte ${p.min}</small>
 <div class="acts"><button class="s ghost" data-a="edP" data-id="${p.id}">Modifier</button></div></div>${del('delP',p.id)}</div>`).join(''):empty('Ajoutez vos produits avec leurs prix pour commencer.'))}

function stock(){return S.p.length?S.p.map(p=>{const s=stat(p);
 return`<div class="it"><div style="flex:1"><b>${esc(p.name)}</b> <span class="bd ${s[1]}">${s[0]}</span><br><small>Initial ${p.stock} + Entrées ${bought(p.id)} − Sorties ${sold(p.id)}<br>Valeur : ${$(Math.max(0,stk(p))*p.buy)}</small>
 <div class="acts"><button class="s" data-a="addA" data-id="${p.id}">+ Achat</button></div></div><div class="r"><strong style="font-size:22px">${stk(p)}</strong><br><small>en stock</small></div></div>`}).join(''):empty("Ajoutez d'abord vos produits dans l'onglet Produits.")}

function achats(){const l=S.a.filter(x=>inM(x.d,month)).sort((a,b)=>b.d.localeCompare(a.d));
 return`<button class="add" data-a="addA">+ Nouvel achat</button>`+(l.length?`<div class="k" style="margin-bottom:8px"><small>Total des achats du mois</small><strong>${$(sum(l,x=>x.q*x.bp))}</strong></div>`+l.map(x=>`<div class="it"><div><b>${esc(x.n)}</b> × ${x.q}<br><small>${x.d.split('-').reverse().join('/')} · ${$(x.bp)} la pièce</small></div><div class="r"><b>${$(x.q*x.bp)}</b></div>${del('delA',x.id)}</div>`).join(''):empty('Aucun achat ce mois-ci. Notez ici la marchandise reçue : elle s\'ajoute au stock.'))}

function clients(){return`<button class="add" data-a="addC">+ Nouveau client</button>`+(S.c.length?S.c.map(c=>{const d=debt(c.id);
 return`<div class="it"><div style="flex:1"><b>${esc(c.name)}</b><br><small>${c.tel?`<a href="tel:${esc(c.tel)}" style="color:inherit">${esc(c.tel)}</a>`:'Sans téléphone'}</small>
 <div class="acts">${d>0?`<button class="s" data-a="pay" data-id="${c.id}">Encaisser</button>`:''}<button class="s ghost" data-a="edC" data-id="${c.id}">Modifier</button></div></div>
 <div class="r">${d>0?`<small>Doit</small><br><strong style="color:var(--rd)">${$(d)}</strong>`:'<span class="bd">À jour</span>'}</div>${del('delC',c.id)}</div>`}).join(''):empty('Ajoutez vos clients (boutiques) pour suivre leurs dettes.'))}

function exps(){const l=S.e.filter(x=>inM(x.d,month)).sort((a,b)=>b.d.localeCompare(a.d));
 return`<button class="add" data-a="addE">+ Nouvelle dépense</button>`+(l.length?l.map(x=>`<div class="it"><div><b>${esc(x.cat)}</b><br><small>${x.d.split('-').reverse().join('/')}${x.t?' · '+esc(x.t):''}</small></div><div class="r"><b>${$(x.a)}</b></div>${del('delE',x.id)}</div>`).join(''):empty('Aucune dépense ce mois-ci.'))}

const TABS=[['ach','&#128722;','Achats',achats],['sales','&#129534;','Factures',sales],['prod','&#127991;','Produits',produits],['stock','&#128230;','Stock',stock],['clients','&#128101;','Clients',clients],['exp','&#128184;','Dépenses',exps],['dash','&#128202;','Tableau de bord',home]]; 
function draw(){document.getElementById('v').innerHTML=TABS.find(t=>t[0]==tab)[3]();
 document.getElementById('nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-id="${t[0]}" class="${t[0]==tab?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('');
 document.getElementById('mo').style.visibility=['prod','stock','clients'].includes(tab)?'hidden':'visible';document.getElementById('mo').value=month;document.getElementById('sub').textContent=S.u?S.u.biz:'RIMBA';document.getElementById('lgh').src=LOGO;const nv=document.getElementById('nav'),on=nv.querySelector('.on');nv.scrollLeft=on.offsetLeft-(nv.clientWidth-on.offsetWidth)/2}

function form(title,fields,ok){const m=document.getElementById('modal');
 m.innerHTML=`<form class="sheet"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.t=='select'?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}"${o[0]==f.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" ${f.t=='number'?'step="any" min="0" inputmode="decimal"':''} ${f.r?'required':''} placeholder="${esc(f.ph||'')}">`}</label>`).join('')}<div class="row"><button type="button" class="ghost" data-a="close">Annuler</button><button>Enregistrer</button></div></form>`;
 m.hidden=false;m.querySelector('form').onsubmit=e=>{e.preventDefault();if(ok(Object.fromEntries(new FormData(e.target)))!==false){m.hidden=true;save();draw()}}}
const close=()=>document.getElementById('modal').hidden=true;
const prodForm=(p)=>{form(p?'Modifier le produit':'Nouveau produit',[
 {k:'name',l:'Nom du produit',v:p?p.name:'',r:1},{k:'buy',l:"Prix d'achat ($)",t:'number',v:p?p.buy:'',r:1},{k:'sell',l:'Prix de vente ($)',t:'number',v:p?p.sell:'',r:1},
 {k:'stock',l:'Stock initial (pièces)',t:'number',v:p?p.stock:'0'},{k:'min',l:"Seuil d'alerte (pièces)",t:'number',v:p?p.min:'5'}],
 d=>{const o={name:d.name.trim(),buy:+d.buy,sell:+d.sell,stock:+d.stock||0,min:+d.min||0};p?Object.assign(p,o):S.p.push({id:uid(),...o})})};
const achForm=pid=>{if(!S.p.length){alert("Ajoutez d'abord un produit dans l'onglet Produits.");return}
 form('Nouvel achat',[{k:'d',l:'Date',t:'date',v:td()},{k:'pid',l:'Produit',t:'select',v:pid,o:S.p.map(p=>[p.id,p.name])},{k:'q',l:'Quantité reçue',t:'number',r:1,v:''},{k:'bp',l:"Prix d'achat unitaire ($)",t:'number',v:'',ph:"Vide = prix d'achat du produit"}],
 d=>{const p=S.p.find(p=>p.id==d.pid),q=+d.q;if(!(q>0))return false;S.a.push({id:uid(),d:d.d||td(),pid:p.id,n:p.name,q,bp:d.bp===''?p.buy:+d.bp})})};
let LN='';
function invForm(){if(!S.p.length){alert("Ajoutez d'abord un produit dans l'onglet Produits.");return}
 const o=S.p.map(p=>`<option value="${p.id}">${esc(p.name)} (${stk(p)}) ${$(p.sell)}</option>`).join('');
 LN=`<div class="row ln"><select>${o}</select><input type="number" min="1" inputmode="numeric" placeholder="Qté" style="max-width:76px"></div>`;
 const m=document.getElementById('modal');m.hidden=false;
 m.innerHTML=`<form class="sheet"><h3>Nouvelle facture</h3><label>Date<input type="date" name="d" value="${td()}"></label>
 <label>Client<select name="cid"><option value="">Client comptoir (sans nom)</option>${S.c.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>
 <div id="lns">${LN}</div><button type="button" class="ghost s" data-a="ln" style="margin-bottom:10px">+ Ajouter un article</button>
 <div class="k" style="margin-bottom:10px"><small>Total de la facture</small><strong id="tt">$0.00</strong></div>
 <label>Montant payé ($)<input name="paid" type="number" min="0" step="any" inputmode="decimal" placeholder="Vide = payée en entier"></label>
 <div class="row"><button type="button" class="ghost" data-a="close">Annuler</button><button>Créer la facture</button></div></form>`;
 const fm=m.querySelector('form'),rd=()=>[...fm.querySelectorAll('.ln')].map(r=>({pid:r.children[0].value,q:+r.children[1].value||0})).filter(x=>x.q>0);
 fm.oninput=fm.onchange=()=>document.getElementById('tt').textContent=$(sum(rd(),x=>x.q*S.p.find(p=>p.id==x.pid).sell));
 fm.onsubmit=e=>{e.preventDefault();const L=rd();if(!L.length){alert('Ajoutez au moins un article avec sa quantité.');return}
  for(const p of S.p){const q=sum(L.filter(x=>x.pid==p.id),x=>x.q);if(q>stk(p)&&!confirm(`Stock insuffisant pour ${p.name} (${stk(p)} pièces). Continuer ?`))return}
  const d=new FormData(fm),c=S.c.find(c=>c.id==d.get('cid')),id=uid(),dt=d.get('d')||td();S.n++;
  L.forEach(x=>{const p=S.p.find(p=>p.id==x.pid);S.s.push({id:uid(),fid:id,d:dt,pid:p.id,n:p.name,q:x.q,sp:p.sell,bp:p.buy})});
  const T=sum(L,x=>x.q*S.p.find(p=>p.id==x.pid).sell),pd=d.get('paid');
  S.f.push({id,no:'F-'+String(S.n).padStart(4,'0'),d:dt,cid:c?c.id:'',cn:c?c.name:'',paid:pd===''?T:Math.min(+pd,T)});save();viewInv(id);draw()}}
function mkPdf(f){const L=S.s.filter(x=>x.fid==f.id),T=invTot(f),P=[];let c,y;
 const E=t=>String(t).replace(/[\u202f\u00a0]/g,' ').replace(/[—–]/g,'-').replace(/[\\()]/g,'\\$&').replace(/[^\x00-\xFF]/g,'?');
 const np=()=>{c=[];P.push(c);y=790};
 const t=(q,x,yy,z=11,b=0,r=0)=>{q=E(q);if(r)x-=q.length*z*.54;c.push(`BT /F${b?2:1} ${z} Tf ${x.toFixed(1)} ${yy} Td (${q}) Tj ET`)};
 const fd=f.d.split('-').reverse().join('/');
 np();c.push('0.12 0.42 0.23 rg 0 740 595 102 re f 1 g');t(S.u?S.u.biz:'RIMBA',40,805,22,1);t('FACTURE '+f.no,40,775,13);t(fd,555,805,11,0,1);t(S.u&&S.u.who?S.u.who:'',555,775,10,0,1);{const u=S.u||{},ct=[u.addr,u.tel?'Tél : '+u.tel:''].filter(Boolean).join('  ·  ');if(ct)t(ct.slice(0,95),40,752,10)}
 c.push('0 g');t('Client : '+(f.cn||'Client comptoir'),40,708,13,1);
 const head=()=>{t('Article',40,y,10,1);t('Qté',350,y,10,1,1);t('Prix unitaire',450,y,10,1,1);t('Total',555,y,10,1,1);c.push(`0.7 G 40 ${y-6} m 555 ${y-6} l S`);y-=24};
 y=670;head();
 L.forEach(x=>{if(y<110){np();head()}t(x.n,40,y);t(String(x.q),350,y,11,0,1);t($(x.sp),450,y,11,0,1);t($(tot(x)),555,y,11,0,1);y-=20});
 if(y<150){np()}y-=10;c.push(`0.7 G 300 ${y+14} m 555 ${y+14} l S`);
 t('TOTAL',300,y,13,1);t($(T),555,y,13,1,1);t('Payé',300,y-22);t($(f.paid),555,y-22,11,0,1);t('Reste à payer',300,y-44,12,1);t($(T-f.paid),555,y-44,12,1,1);
 P.forEach((q,i)=>q.push(`BT /F1 9 Tf 40 30 Td (${E('Merci pour votre confiance · Facture '+f.no+' · Page '+(i+1)+'/'+P.length)}) Tj ET`));
 const o=['','<</Type/Catalog/Pages 2 0 R>>',`<</Type/Pages/Kids[${P.map((_,i)=>(5+2*i)+' 0 R').join(' ')}]/Count ${P.length}>>`,'<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>','<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>'];
 P.forEach((q,i)=>{const d=q.join('\n');o.push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${6+2*i} 0 R>>`,`<</Length ${d.length}>>\nstream\n${d}\nendstream`)});
 let out='%PDF-1.4\n',off=[];for(let i=1;i<o.length;i++){off[i]=out.length;out+=`${i} 0 obj\n${o[i]}\nendobj\n`}
 const x=out.length;out+=`xref\n0 ${o.length}\n0000000000 65535 f \n`+off.slice(1).map(v=>String(v).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${o.length}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;
 return new Blob([Uint8Array.from(out,ch=>ch.charCodeAt(0))],{type:'application/pdf'})}
async function sendPdf(id,share){const f=S.f.find(f=>f.id==id),b=mkPdf(f),name='Facture_'+f.no+'.pdf';
 if(share){try{const file=new File([b],name,{type:'application/pdf'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:'Facture '+f.no});return}}catch(e){if(e&&e.name=='AbortError')return}}
 try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data:b});return}}catch(e){if(e&&e.code=='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function invText(f){const L=S.s.filter(x=>x.fid==f.id),T=invTot(f);
 const u=S.u||{};return`*${u.biz||'RIMBA'}*${u.tel?' · '+u.tel:''}${u.addr?'\n'+u.addr:''}\nFacture ${f.no}\n${f.d.split('-').reverse().join('/')} · ${f.cn||'Client comptoir'}\n\n`+L.map(x=>`${x.n} × ${x.q} × ${$(x.sp)} = ${$(tot(x))}`).join('\n')+`\n\nTotal : ${$(T)}\nPayé : ${$(f.paid)}\nReste : ${$(T-f.paid)}\n\nMerci pour votre confiance.`}
function viewInv(id){const f=S.f.find(f=>f.id==id);if(!f)return;const L=S.s.filter(x=>x.fid==id),T=invTot(f),m=document.getElementById('modal');m.hidden=false;
 m.innerHTML=`<div class="sheet"><h3>Facture ${f.no}</h3><p style="margin:0 0 10px;color:var(--mu)">${f.d.split('-').reverse().join('/')} · ${esc(f.cn||'Client comptoir')}</p>
 ${L.map(x=>`<div class="it"><div>${esc(x.n)}<br><small>${x.q} × ${$(x.sp)}</small></div><b>${$(tot(x))}</b></div>`).join('')}
 <div class="k" style="margin:10px 0"><small>Total</small><strong>${$(T)}</strong><br><small>Payé ${$(f.paid)} · Reste ${$(T-f.paid)}</small></div>
 <div class="row" style="margin-bottom:8px"><button data-a="wp" data-id="${id}">PDF sur WhatsApp</button><button class="ghost" data-a="pdf" data-id="${id}">Télécharger PDF</button></div><div class="row" style="margin-bottom:8px"><button class="ghost" data-a="sh" data-id="${id}">Envoyer en texte</button><button class="ghost" data-a="close">Fermer</button></div><button class="x" data-a="delF" data-id="${id}" style="width:100%">Supprimer cette facture</button></div>`}
function gate(){const g=document.getElementById('gate');g.hidden=false;const u=S.u;
 g.innerHTML=`<form class="sheet" style="margin:auto;border-radius:16px;max-width:420px"><img class="lg" src="${LOGO}" alt="RIMBA" style="height:110px;margin:0 auto 12px"><h3>${u?'Bonjour '+esc(u.biz):'Créer mon compte RIMBA'}</h3>
 ${u?'':'<label>Nom de la boutique ou de l\'entreprise<input name="biz" required></label><label>Votre nom<input name="who"></label><label>Téléphone / WhatsApp<input name="tel" type="tel" inputmode="tel"></label><label>Adresse<input name="addr" placeholder="Ex : Av. Lumumba n°12, Lubumbashi"></label>'}
 <label>${u?'Code PIN':'Choisissez un code PIN (4 chiffres)'}<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><button style="width:100%">${u?'Ouvrir':'Créer mon compte'}</button></form>`;
 g.querySelector('form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
  if(u){if(d.pin!=u.pin){alert('Code PIN incorrect.');return}}else{S.u={biz:d.biz.trim(),who:(d.who||'').trim(),tel:(d.tel||'').trim(),addr:(d.addr||'').trim(),pin:d.pin};save()}
  g.hidden=true;g.innerHTML='';draw()}}
const cliForm=c=>form(c?'Modifier le client':'Nouveau client',[{k:'name',l:'Nom du client ou de la boutique',v:c?c.name:'',r:1},{k:'tel',l:'Téléphone',t:'tel',v:c?c.tel:''}],
 d=>{const o={name:d.name.trim(),tel:d.tel.trim()};c?Object.assign(c,o):S.c.push({id:uid(),...o})});

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
 const P=()=>S.p.find(p=>p.id==id),C=()=>S.c.find(c=>c.id==id);
 if(a=='tab'){tab=id;draw();scrollTo(0,0)}
 else if(a=='close')close();
 else if(a=='addP')prodForm();else if(a=='edP')prodForm(P());
 else if(a=='addC')cliForm();else if(a=='edC')cliForm(C());
 else if(a=='addA')achForm(id);
 else if(a=='pay'){const c=C();form('Encaisser : '+esc(c.name),[{k:'a',l:`Montant reçu ($) — il doit ${$(debt(c.id))}`,t:'number',v:debt(c.id),r:1},{k:'d',l:'Date',t:'date',v:td()}],d=>{S.y.push({id:uid(),cid:c.id,a:+d.a,d:d.d||td()})})}
 else if(a=='addS')invForm();else if(a=='vf')viewInv(id);
 else if(a=='ln'){document.getElementById('lns').insertAdjacentHTML('beforeend',LN)}
 else if(a=='sh'){const t=invText(S.f.find(f=>f.id==id));if(navigator.share)navigator.share({text:t}).catch(()=>{});else open('https://wa.me/?text='+encodeURIComponent(t))}
 else if(a=='delF'){if(!confirm('Supprimer cette facture ? Le stock, les clients et le tableau de bord seront recalculés.'))return;S.f=S.f.filter(f=>f.id!=id);S.s=S.s.filter(x=>x.fid!=id);save();close();draw()}
 else if(a=='lock')gate();
 else if(a=='acc'){const u=S.u;form('Mon compte',[{k:'biz',l:'Nom de la boutique',v:u.biz,r:1},{k:'who',l:'Votre nom',v:u.who||''},{k:'tel',l:'Téléphone / WhatsApp',t:'tel',v:u.tel||''},{k:'addr',l:'Adresse',v:u.addr||''}],d=>{Object.assign(u,{biz:d.biz.trim(),who:d.who.trim(),tel:d.tel.trim(),addr:d.addr.trim()})})}
 else if(a=='wp')sendPdf(id,1);else if(a=='pdf')sendPdf(id,0);
 else if(a=='am'){arch=+id;draw()}
 else if(a=='addE')form('Nouvelle dépense',[{k:'d',l:'Date',t:'date',v:td()},{k:'cat',l:'Catégorie',t:'select',o:['Transport','Loyer','Salaires','Électricité / eau','Communication','Emballage','Taxes','Autres'].map(x=>[x,x])},{k:'a',l:'Montant ($)',t:'number',r:1,v:''},{k:'t',l:'Détail (facultatif)',v:''}],
  d=>{S.e.push({id:uid(),d:d.d||td(),cat:d.cat,a:+d.a,t:d.t.trim()})});
 else if(a=='bk'){const m=document.getElementById('modal');m.hidden=false;
  m.innerHTML=`<div class="sheet"><h3>Sauvegarde</h3><p style="color:var(--mu);margin-top:0">Vos données sont gardées dans ce téléphone. Copiez-les et gardez-les (WhatsApp, notes) pour ne rien perdre ou changer de téléphone.</p><textarea id="bt" rows="5" readonly>${esc(JSON.stringify(S))}</textarea><div class="row" style="margin:10px 0"><button data-a="cp">Copier</button><button class="ghost" data-a="rs">Restaurer</button></div><button class="ghost" style="width:100%" data-a="close">Fermer</button></div>`}
 else if(a=='cp'){const t=document.getElementById('bt');t.select();try{navigator.clipboard.writeText(t.value)}catch(x){document.execCommand('copy')}b.textContent='Copié ✓'}
 else if(a=='rs'){const t=document.getElementById('bt');if(b.dataset.r!='1'){t.readOnly=false;t.value='';t.placeholder='Collez ici votre sauvegarde, puis appuyez sur Restaurer.';t.focus();b.dataset.r='1';b.textContent='Restaurer maintenant'}
  else{try{const o=JSON.parse(t.value);if(!o.p||!o.s||!o.f)throw 0;if(confirm('Remplacer toutes les données actuelles ?')){S=o;S.a=S.a||[];S.y=S.y||[];S.e=S.e||[];S.f=S.f||[];S.n=S.n||0;save();close();draw()}}catch(x){alert('Sauvegarde invalide.')}}}
 else if(a.startsWith('del')){if(!confirm('Supprimer ?'))return;const m={delP:'p',delC:'c',delE:'e',delA:'a'}[a];S[m]=S[m].filter(x=>x.id!=id);save();draw()}
});
document.addEventListener('input',e=>{if(e.target.id=='fq'){fq=e.target.value;document.getElementById('fl').innerHTML=invList()}});
document.getElementById('mo').onchange=e=>{if(e.target.value){month=e.target.value;draw()}};
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id=='modal')close()});
draw();if(!S.u||S.u.pin)gate();
</script></body></html>
